<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ColorOS 17 Liquid Glass Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#090b10;color:#f5f7fa;padding:12px;display:flex;justify-content:center}
.wrap{width:100%;max-width:430px;display:flex;flex-direction:column;gap:11px;padding-bottom:35px}
.card{background:#141924;border:1px solid #263042;border-radius:15px;padding:13px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center}
.badge{font-size:11px;background:#064e3b;color:#34d399;padding:3px 9px;border-radius:12px;font-weight:700}
.lbl{font-size:11px;color:#94a3b8;font-weight:700;text-transform:uppercase}
.row{display:flex;gap:8px}
input[type=text]{flex:1;background:#0b0e14;border:1px solid #2a3447;color:#fff;padding:9px 11px;border-radius:10px;font-size:13px}
button{border:none;font-weight:600;cursor:pointer;border-radius:10px}
.btn-b{background:#0a84ff;color:#fff;padding:9px 14px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#1e2636;color:#e2e8f0;padding:6px 10px;border-radius:16px;font-size:12px;border:1px solid #2e3a52}
.chip.on{background:#0a84ff;color:#fff}
.fbox{display:flex;justify-content:space-between;align-items:center;background:#0b0e14;border:1px dashed #3b4861;padding:8px 11px;border-radius:10px;font-size:12px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.citem{background:#0b0e14;border:1px solid #242e40;padding:6px 9px;border-radius:9px;display:flex;justify-content:space-between;align-items:center;font-size:11.5px}
input[type=color]{width:26px;height:22px;border:none;background:none}
.sgrp{display:flex;flex-direction:column;gap:4px;font-size:12px}
.shdr{display:flex;justify-content:space-between;color:#cbd5e1}
input[type=range]{width:100%;accent-color:#0a84ff}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mock{position:relative;height:235px;border-radius:15px;overflow:hidden;border:1px solid #334155;background:#0d131f}
.mwall{position:absolute;inset:-8px;background:linear-gradient(135deg,#1e293b,#0f172a,#1e1b4b);background-size:cover;background-position:center}
.mdim{position:absolute;inset:0;background:#000;opacity:.25}
.mcont{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:7px}
.mbar{padding:5px 8px;border-radius:9px;font-size:11px;font-weight:700;display:flex;justify-content:space-between}
.mitem{padding:5px 7px;border-radius:8px;margin-bottom:4px;font-size:10px}
.mbub{padding:6px 8px;font-size:10px;max-width:86%;margin-bottom:5px}
.btn-main{width:100%;padding:13px;background:linear-gradient(135deg,#00b4db,#0083b0);color:#fff;font-size:14px;border-radius:13px}
.btn-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-s{padding:10px;background:#1e2636;color:#e2e8f0;font-size:12px;border:1px solid #2e3a52}
#msg{text-align:center;font-size:12px;color:#34d399;min-height:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card top">
    <strong style="font-size:15px">💧 ColorOS 17 Glass</strong>
    <span class="badge" id="jsState">Loading...</span>
  </div>

  <div class="card">
    <div class="lbl">1. Mood & Presets</div>
    <div class="row">
      <input type="text" id="moodIn" value="Black" placeholder="Black, Pink, Green, Neon, Light">
      <button type="button" class="btn-b" id="bMood">Auto ✨</button>
    </div>
    <div class="chips" id="chipBox">
      <button type="button" class="chip on" data-k="ice">💧 Ice</button>
      <button type="button" class="chip" data-k="sakura">🌸 Sakura</button>
      <button type="button" class="chip" data-k="midnight">🌃 Midnight</button>
      <button type="button" class="chip" data-k="emerald">🌿 Emerald</button>
      <button type="button" class="chip" data-k="neon">⚡ Neon</button>
      <button type="button" class="chip" data-k="crystal">🤍 Light</button>
    </div>
  </div>

  <div class="card">
    <div class="lbl">2. Wallpaper Embed & Name</div>
    <input type="text" id="tName" value="ColorOS17_Glass">
    <div class="fbox">
      <span id="fLbl" style="color:#94a3b8;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Default Gradient</span>
      <label class="btn-b" style="padding:6px 11px;border-radius:8px;cursor:pointer">
        Choose Photo
        <input type="file" id="wIn" accept="image/*" style="display:none">
      </label>
    </div>
  </div>

  <div class="card">
    <div class="lbl">3. Glass Palette (White-Bug Fixed)</div>
    <div class="cgrid">
      <div class="citem"><span>Home BG</span><input type="color" id="c1" value="#101522"></div>
      <div class="citem"><span>Bars/Tabs</span><input type="color" id="c2" value="#182234"></div>
      <div class="citem"><span>My Bubble</span><input type="color" id="c3" value="#0a84ff"></div>
      <div class="citem"><span>Friend Bub</span><input type="color" id="c4" value="#1e293b"></div>
      <div class="citem"><span>Main Text</span><input type="color" id="c5" value="#ffffff"></div>
      <div class="citem"><span>Subtext</span><input type="color" id="c6" value="#cbd5e1"></div>
      <div class="citem"><span>Accent</span><input
